<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember Node</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <button id="toggle-sidebar" aria-controls="sidebar" aria-expanded="true">Conversations</button>
    <h1>ᚠ Ember Node</h1>
    <button id="settings-button" aria-controls="settings" aria-expanded="false">Settings</button>
  </header>
  <main>
    <aside id="sidebar">
      <button id="new-chat">New chat</button>
      <p id="conversation-status" role="status">Loading saved chats…</p>
      <nav id="conversation-list" aria-label="Saved conversations"></nav>
    </aside>
    <section id="chat" aria-label="Chat">
      <div id="chat-actions">
        <input id="chat-title" aria-label="Chat name" value="New chat">
        <button id="rename-chat">Rename</button>
        <button id="export-chat">Export Markdown</button>
        <button id="delete-chat">Delete</button>
        <button id="instructions-button" aria-controls="instructions" aria-expanded="false">Active instructions</button>
      </div>
      <p id="save-status" role="status">Choose or create a chat.</p>
      <div id="messages" aria-live="polite"></div>
      <form id="composer">
        <label for="draft">Message</label>
        <textarea id="draft" rows="4" placeholder="Write or paste a passage…"></textarea>
        <div>
          <button id="send" type="submit">Send</button>
          <button id="stop" type="button" disabled>Stop</button>
        </div>
      </form>
    </section>
    <aside id="settings" hidden>
      <h2>Settings</h2>
      <p>Local runtime: <strong id="runtime-status">Checking…</strong></p>
      <label for="model-select">Installed model</label>
      <select id="model-select"><option>Checking…</option></select>
      <p>Chats are stored locally. Backup and recovery controls are not available in Settings yet.</p>
    </aside>
    <aside id="instructions" hidden>
      <h2>Active instructions</h2>
      <div id="instruction-files"></div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
